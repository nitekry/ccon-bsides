## Voyager CTF — Stage 1 decoder config
## Usage:  rtl_433 -c voyager.conf
## Then paste the hex from the "data" field into CyberChef -> "From Hex"

frequency   433.92M
sample_rate 250k

## Flex decoder: aligns on the sync word, prints the payload as hex.
decoder {n=voyager,m=OOK_MC_ZEROBIT,s=250,l=0,r=2000,preamble=2dd42d}
